<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<style>
  .bg{fill:#f8fafc}.box{fill:#fff;stroke:#172033;stroke-width:2;rx:10}.safe{fill:#fff1f2;stroke:#be123c;stroke-width:2.5;rx:10}.io{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.pwr{fill:#f0fdf4;stroke:#15803d;stroke-width:2;rx:10}.future{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;rx:10}.t{font:700 20px Arial;fill:#111827}.s{font:15px Arial;fill:#334155}.n{font:700 13px monospace;fill:#0f172a}.wire{stroke:#334155;stroke-width:2.5;fill:none}.trip{stroke:#be123c;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6}.arrow{marker-end:url(#a)}.redarrow{marker-end:url(#r)}.title{font:700 30px Arial;fill:#0f172a}.sub{font:16px Arial;fill:#475569}
</style>
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
 <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
</defs>
<rect class="bg" width="1500" height="920"/>
<text x="55" y="52" class="title">EVSE Controller Rev A — current draft</text>
<text x="55" y="80" class="sub">OpenEVSE-based architecture · ESP32-S3 · BRCS01C-05-H1 · external contactor deferred</text>

<rect x="55" y="125" width="180" height="115" class="io"/>
<text x="75" y="155" class="t">J_PWR</text><text x="75" y="182" class="s">18–30 VDC isolated</text>
<text x="75" y="205" class="n">+24V_IN / GND / PE</text>

<rect x="290" y="115" width="210" height="135" class="pwr"/>
<text x="310" y="145" class="t">Input protection</text><text x="310" y="173" class="s">F1 · reverse polarity</text>
<text x="310" y="198" class="s">SMBJ33A · filtering</text><text x="310" y="224" class="n">+24V_PROT</text>

<rect x="560" y="100" width="230" height="110" class="pwr"/>
<text x="580" y="132" class="t">TPS54360B</text><text x="580" y="160" class="s">24 V → 5.5 V buck</text>
<text x="580" y="186" class="n">+5V5_PRE</text>

<rect x="850" y="90" width="220" height="100" class="pwr"/>
<text x="870" y="122" class="t">TLV76750</text><text x="870" y="150" class="s">Dedicated RDC LDO</text>
<text x="870" y="175" class="n">+5V_RDC</text>

<rect x="850" y="220" width="220" height="100" class="pwr"/>
<text x="870" y="252" class="t">TPS62133</text><text x="870" y="280" class="s">5.5 V → 3.3 V</text>
<text x="870" y="305" class="n">+3V3</text>

<path d="M235 182H290" class="wire arrow"/><path d="M500 182H560" class="wire arrow"/>
<path d="M790 155H850" class="wire arrow"/><path d="M790 170V270H850" class="wire arrow"/>

<rect x="1135" y="155" width="295" height="210" class="box"/>
<text x="1160" y="190" class="t">ESP32-S3-WROOM-1</text>
<text x="1160" y="220" class="s">CP PWM / state machine</text><text x="1160" y="246" class="s">PP and temperature</text>
<text x="1160" y="272" class="s">Wi-Fi AP + STA · MQTT · NTP</text><text x="1160" y="298" class="s">LED · button · RFID · display</text>
<text x="1160" y="332" class="n">CONTACTOR_REQUEST</text>
<path d="M1070 270H1135" class="wire arrow"/>

<rect x="55" y="350" width="250" height="210" class="io"/>
<text x="75" y="384" class="t">BRCS01C-05-H1</text>
<text x="75" y="416" class="s">5 VDC ±3%</text><text x="75" y="444" class="n">Pin 2 AC&amp;DC TRIP</text>
<text x="75" y="469" class="n">Pin 4 CAL</text><text x="75" y="494" class="n">Pin 5 TEST</text>
<text x="75" y="519" class="n">Pin 6 DC TRIP</text><text x="75" y="544" class="s">L + N through aperture; PE outside</text>

<rect x="365" y="365" width="255" height="180" class="safe"/>
<text x="388" y="400" class="t">Fail-safe inputs</text>
<text x="388" y="431" class="s">10 kΩ pull-ups to 3.3 V</text><text x="388" y="457" class="s">1 kΩ protected buffers</text>
<text x="388" y="486" class="n">LOW = normal</text><text x="388" y="512" class="n">HIGH = trip / broken wire</text>
<path d="M305 455H365" class="trip redarrow"/>

<rect x="680" y="350" width="270" height="210" class="safe"/>
<text x="705" y="385" class="t">Hardware safety logic</text>
<text x="705" y="418" class="s">Set-dominant fault latch</text>
<text x="705" y="446" class="s">DC TRIP · watchdog</text><text x="705" y="472" class="s">RDC power-good · CP fault</text>
<text x="705" y="510" class="n">K1_HW_ENABLE</text><text x="705" y="535" class="s">Unpowered default: OFF</text>
<path d="M620 455H680" class="trip redarrow"/>

<rect x="1030" y="410" width="225" height="125" class="safe"/>
<text x="1052" y="445" class="t">TPS3430-Q1</text>
<text x="1052" y="475" class="s">Window watchdog</text><text x="1052" y="504" class="n">WATCHDOG_OK</text>
<path d="M1030 475H950" class="trip red"/> <path d="M950 475H950" class="trip"/>
<path d="M1030 475H950" class="trip redarrow"/>
<path d="M1255 455H1320V365" class="wire arrow"/>

<rect x="1030" y="585" width="400" height="165" class="future"/>
<text x="1055" y="620" class="t">J_K1 — future contactor module</text>
<text x="1055" y="653" class="n">+24V_K1 · K1_CMD_N</text>
<text x="1055" y="680" class="n">K1_AUX_L · K1_AUX_N</text>
<text x="1055" y="707" class="n">LOAD_V_PRESENT · GND_SELV</text>
<text x="1055" y="735" class="s">Contactor and coil driver: DNP</text>
<path d="M815 560V667H1030" class="trip redarrow"/>
<path d="M1280 365V585" class="dash arrow"/>

<rect x="55" y="650" width="300" height="165" class="io"/>
<text x="78" y="685" class="t">Type 2 cable</text>
<text x="78" y="718" class="n">CP · PP · PE</text><text x="78" y="750" class="s">Attached cable, 32 A limit</text>
<text x="78" y="780" class="s">External Type A RCD</text>

<rect x="430" y="625" width="430" height="220" class="box"/>
<text x="455" y="660" class="t">OpenEVSE-based CP / PP</text>
<text x="455" y="692" class="s">LMV358 push-pull pilot, +12 V / −12 V</text>
<text x="455" y="719" class="s">TC1044S negative rail · 820 Ω baseline</text>
<text x="455" y="746" class="s">P6SMB16CA protection</text>
<text x="455" y="773" class="s">3.3 V CP divider: 390 k / 82 k / 120 k</text>
<text x="455" y="800" class="s">Comparator state windows + ADC diagnostics</text>
<text x="455" y="827" class="n">CP_PWM · CP_STATE · PP_READ</text>
<path d="M355 730H430" class="wire arrow"/>
<path d="M860 720H955V330H1135" class="wire arrow"/>

<text x="55" y="884" class="sub">DRAFT — not approved for mains or vehicle connection · contactor and final ERC pending</text>
</svg>